name: Probe large move

# Derive a large-move threshold from the distribution rather than choosing one.
# Manual, posts nothing, decides nothing.
#
# The number that decides it is what fires per week, not a percentile: the
# persistence rule's rejected first version fired for 12, 8, 9 and 12 tickers
# of 19, and a section naming half the roster is the firehose the digest
# exists to filter.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -u probe_largemove.py

name: Reg SHO threshold list

on:
  schedule:
    # 05:15 UTC Tue-Sat, which is 1:15am Eastern. Nasdaq publishes each
    # settlement day's file before midnight Eastern, so running after that
    # picks up the completed file for the day just ended. Running earlier
    # only ever finds the previous day's.
    #
    # Tue-Sat in UTC covers Mon-Fri Eastern.
    - cron: "15 5 * * 2-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check and log without posting or saving state"
        type: boolean
        default: true

permissions:
  contents: write   # commits threshold_state.json

concurrency:
  group: threshold-list
  cancel-in-progress: false

jobs:
  threshold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Refresh state from origin
        # A run queued behind another run of this workflow checks out the SHA
        # fixed when the run was CREATED, not when its job started, so threshold_state.json
        # on disk can already be a push behind before the component reads it.
        # That stale read is what reposts items to Discord; the retry loop in
        # Persist state only fixes the write. See the trap table in CLAUDE.md.
        # Only the state file is refreshed — the code stays at the checked-out
        # ref, so a dispatch still tests the ref it was dispatched against.
        run: |
          git fetch -q origin "$GITHUB_REF_NAME"
          # Via a temp file: a redirect truncates first, so a failed show
          # would leave an empty state file and repost everything.
          git show "origin/$GITHUB_REF_NAME:threshold_state.json" > "$RUNNER_TEMP/origin_state.json"
          mv "$RUNNER_TEMP/origin_state.json" threshold_state.json
          if git diff --quiet HEAD -- threshold_state.json; then
            echo "State was already current."
          else
            echo "Refreshed threshold_state.json from origin; the checkout was behind."
          fi

      - name: Check threshold list
        timeout-minutes: 5
        env:
          # Prefers the alerts channel; falls back to market-data if unset.
          WEBHOOK_URL_ALERTS: ${{ secrets.WEBHOOK_URL_ALERTS }}
          WEBHOOK_URL_MARKET: ${{ secrets.WEBHOOK_URL_MARKET }}
          DRY_RUN: ${{ inputs.dry_run }}
          PYTHONUNBUFFERED: "1"
        run: python -u threshold_list.py

      - name: Persist state
        # Re-fetch before pushing. A run that was queued behind another checks
        # out the SHA pinned when it was CREATED, so it can hold a state file
        # that is already stale by the time it pushes — see the trap table in CLAUDE.md.
        # Last writer wins, which is correct: each run recomputes state as
        # everything-seen-before plus whatever it just saw, so the later file is
        # a superset.
        run: |
          if [[ -z "$(git status --porcelain threshold_state.json)" ]]; then
            echo "No state change."
            exit 0
          fi
          git config user.name "threshold-list"
          git config user.email "actions@github.com"
          cp threshold_state.json "$RUNNER_TEMP/threshold_state.json"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            cp "$RUNNER_TEMP/threshold_state.json" threshold_state.json
            if [[ -z "$(git status --porcelain threshold_state.json)" ]]; then
              echo "State already current on origin; nothing to push."
              exit 0
            fi
            git add threshold_state.json
            git commit -q -m "Update threshold list state [skip ci]"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "State pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); another run pushed first. Retrying."
            sleep $((attempt * 3))
          done
          echo "Could not persist threshold_state.json after 5 attempts." >&2
          exit 1

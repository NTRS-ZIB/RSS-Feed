name: Press release monitor

on:
  schedule:
    # Every 15 min, weekdays only, 12:00-23:59 UTC.
    # GitHub cron is UTC and has no DST awareness, so this window is set wide
    # enough to cover 8am-6pm Eastern year-round without seasonal edits:
    #   EDT (summer, UTC-4): 8am - 7pm ET
    #   EST (winter, UTC-5): 7am - 6pm ET
    # GitHub queues scheduled jobs at low priority, so expect 15-25 min drift.
    - cron: "*/15 12-23 * * 1-5"
  workflow_dispatch: # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write # needed to commit the updated state file

concurrency:
  group: press-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run monitor
        timeout-minutes: 10
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          PYTHONUNBUFFERED: "1"
        run: python -u press_monitor.py

      - name: Persist state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "press-monitor"
            git config user.email "actions@github.com"
            git add state.json
            git commit -m "Update seen items [skip ci]"
            git push
          else
            echo "No state change."
          fi

name: Press release monitor

on:
  schedule:
    # Once an hour, weekdays, 07:00-23:59 UTC; the job itself then checks on
    # each fifteen-minute boundary until its hour is out. See the poll step for
    # why the granularity moved off the cron and onto the job.
    #
    # The window opens at 07:07, not at EDGAR's 10:00 UTC opening, because a
    # fire has to arrive before a filing to catch it and morning fires arrive
    # 83-173 minutes late. A 10:07 fire lands around 12:20 and misses the
    # 10:00-12:30 block entirely — about 945 filings, 12% of the roster's
    # history. Simulated against the measured filing and delay distributions,
    # 07:07 catches 85% of filings within 15 minutes against 77% for 10:07.
    #
    # BUDGET_MIN IS 165, RAISED FROM 55 ON 2026-09-18, AND THE CONSTRAINT THAT
    # SET 55 NO LONGER EXISTS. The old note read: "A 75-minute budget reaches
    # 88%, but three points cost 23% of fires cancelled by supersession against
    # 3%, and cancelled fires are the mechanism behind the duplicate posting
    # this schedule work started from." That arithmetic assumed fires arriving
    # about an hour apart, which is what a 55-minute job had to fit inside.
    #
    # They no longer do. On 2026-08-26 GitHub stopped delivering most of this
    # repo's sub-daily fires: measured over 18 weekdays, 4 delivered per weekday
    # against a cron asking 17, with a median gap between delivered fires of
    # 3.64h. A 165-minute job finishes inside that gap, so supersession is back
    # near zero rather than at the 23% the old note priced.
    #
    # WHY 165 AND NOT MORE. The cause of the shedding is inferred, not proven,
    # and the strongest discriminator is DUTY CYCLE: this workflow and Volume
    # spikes are the only two that hold a runner for ~95% of their own cron
    # period, together ~90% of the repo's Actions minutes, and they are exactly
    # the two that collapsed. So the budget is capped at the point where total
    # runner minutes stay BELOW the pre-collapse level that GitHub was already
    # sustaining: 14 fires x ~50m = ~700 min/weekday before, 4 x 165 = 660 now.
    # Asking for more than the repo consumed when delivery was healthy would be
    # betting against the only hypothesis the evidence supports.
    #
    # WHAT THIS DOES NOT FIX. A budget extends coverage FORWARD from whenever a
    # fire lands; it cannot make an earlier fire land. Delivery per cron hour,
    # measured: 07-11 UTC all at 0.06 fires/weekday, 12:00 at 0.67. The morning
    # is dark because those fires are never delivered, and no budget recovers
    # it. See docs/press-monitor.md.
    #
    # IF DELIVERY RECOVERS to hourly, this becomes a ~100% duty cycle and
    # supersession returns in force. That is safe for correctness — the stale
    # checkout that caused the duplicate posting is handled by refresh_state
    # before the monitor step and the fetch-and-retry around the push — but it
    # is the condition under which this number should be reconsidered, and the
    # delivered-fires-per-weekday count is what shows it.
    #
    # GitHub cron is UTC and has no DST awareness:
    #   EDT (summer, UTC-4): 3am - 8pm ET
    #   EST (winter, UTC-5): 2am - 7pm ET
    # Scheduled jobs are queued at low priority; the loop absorbs the drift by
    # aligning to wall-clock quarter hours.
    - cron: "7 7-23 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate and log without posting or saving state"
        type: boolean
        default: true
      poll:
        description: "Take the poll loop rather than a single pass. Pair with dry_run to exercise the loop against live data without posting."
        type: boolean
        default: false

permissions:
  contents: write # needed to commit the updated state file

concurrency:
  group: press-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 195
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Poll on each fifteen-minute boundary until the hour is out
        # One scheduled fire an hour, not four. GitHub drops scheduled runs
        # under load and, by its own documentation, drops them hardest at the
        # top of the hour; of the */15 fires this workflow asked for, roughly
        # 5% actually ran. So ask once and supply the fifteen-minute
        # granularity here, where GitHub cannot drop it. The fire is at :07
        # rather than :00 for the same reason.
        #
        # State is re-read and pushed once per pass, not once per job. A job
        # that loaded state at startup and looped would be as stale by pass
        # eight as a queued run is at job start — the same bug, smaller.
        #
        # A dispatch runs a single pass. Looping for an hour on a manual dry
        # run holds a runner and shows nothing the first pass did not.
        # BUDGET_MIN + the per-pass timeout below + slack: 165 + 13 + 7.
        timeout-minutes: 185
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_URL_INSIDER: ${{ secrets.WEBHOOK_URL_INSIDER }}
          # Feed-outage notices only. Same channel failure-notice.yml uses,
          # which catches a failed run; this catches a source going dark
          # while the run keeps succeeding.
          WEBHOOK_URL_OPS: ${{ secrets.WEBHOOK_URL_OPS }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # Empty on scheduled runs, so those always post.
          DRY_RUN: ${{ inputs.dry_run }}
          # True on the cron; a dispatch does one pass unless it asks for
          # the loop. A dispatch cannot otherwise exercise the loop at all,
          # and 'no pass reposts what the last one posted' is a multi-pass
          # property that no single-pass run can demonstrate.
          POLL: ${{ github.event_name == 'schedule' || inputs.poll }}
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name "press-monitor"
          git config user.email "actions@github.com"

          # Explicit `|| return 1` on every line: these functions are called
          # from `if !`, which suspends `set -e` for everything they run.
          refresh_state() {
            local before after
            before=$(sha1sum state.json | cut -d" " -f1) || return 1
            git fetch -q origin "$GITHUB_REF_NAME" || return 1
            # Via a temp file — a redirect truncates first, so a failed show
            # would leave an empty state file and repost everything.
            git show "origin/$GITHUB_REF_NAME:state.json" \
              > "$RUNNER_TEMP/origin_state.json" || return 1
            mv "$RUNNER_TEMP/origin_state.json" state.json || return 1
            # The dates file may not exist on origin yet, and absent is not an
            # error: the first run that finds an announcement creates it.
            if git show "origin/$GITHUB_REF_NAME:earnings_dates.json" \
                 > "$RUNNER_TEMP/origin_dates.json" 2>/dev/null; then
              mv "$RUNNER_TEMP/origin_dates.json" earnings_dates.json || return 1
            else
              echo "No earnings_dates.json on origin yet."
            fi
            after=$(sha1sum state.json | cut -d" " -f1) || return 1
            # Reported every pass, either way. "Already current" on every
            # run for weeks would mean this guard has never once been
            # exercised in the case it exists for, which is worth knowing.
            # On pass 1 a difference means the checkout was behind; on
            # later passes it means another run pushed mid-loop.
            if [[ "$before" == "$after" ]]; then
              echo "State was already current."
            else
              echo "Refreshed state.json from origin; what was on disk was behind."
            fi
          }

          persist_state() {
            if [[ -z "$(git status --porcelain state.json earnings_dates.json)" ]]; then
              echo "No state change."
              return 0
            fi
            cp state.json "$RUNNER_TEMP/state.json" || return 1
            # Copied BEFORE the reset below and restored after it, exactly like
            # state.json. A file that is written but not carried across the
            # reset is discarded every run, silently.
            if [[ -f earnings_dates.json ]]; then
              cp earnings_dates.json "$RUNNER_TEMP/earnings_dates.json" || return 1
            fi
            for attempt in 1 2 3 4 5; do
              git fetch -q origin "$GITHUB_REF_NAME" || return 1
              git reset -q --hard "origin/$GITHUB_REF_NAME" || return 1
              cp "$RUNNER_TEMP/state.json" state.json || return 1
              if [[ -f "$RUNNER_TEMP/earnings_dates.json" ]]; then
                cp "$RUNNER_TEMP/earnings_dates.json" earnings_dates.json || return 1
              fi
              if [[ -z "$(git status --porcelain state.json earnings_dates.json)" ]]; then
                echo "State already current on origin; nothing to push."
                return 0
              fi
              # Guarded: on any run before the first write the file does not
              # exist, and an unconditional `git add` of a missing path fails.
              git add state.json || return 1
              [[ -f earnings_dates.json ]] && { git add earnings_dates.json || return 1; }
              git commit -q -m "Update seen items [skip ci]" || return 1
              if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
                echo "State pushed on attempt $attempt."
                return 0
              fi
              echo "Push rejected (attempt $attempt); another run pushed first. Retrying."
              sleep $((attempt * 3))
            done
            echo "Could not persist state.json after 5 attempts." >&2
            return 1
          }

          # The budget is elapsed time from THIS job's start, not the top of
          # the next hour. Measured on this repo: every scheduled run is 51 to
          # 173 minutes late, so a fire nominally at :07 arrives near :59 —
          # and a wall-clock-hour deadline then granted it seconds of budget
          # instead of an hour. On 2026-08-04 six seconds of job-start jitter
          # was the difference between four passes and one, and the one-pass
          # run would have printed "1 pass(es), 0 failed" and read as success.
          # Elapsed budget is immune to where in the hour the job starts.
          #
          # 55m sits just under the 61m mean arrival gap in the afternoon
          # regime. Mornings run 83-173m late, so a gap is expected there; the
          # budget VALUE is a separate question from the budget FRAME, and
          # only the frame is being fixed here.
          BUDGET_MIN=165
          # A boundary this close is the same check twice — skip to the next.
          MIN_GAP=180
          started=$(date -u +%s)
          deadline=$(( started + BUDGET_MIN * 60 ))
          passes=0
          failed=0
          fatal=0

          # Stated up front so a short run is self-explaining. A run that does
          # one pass because it started at :50 and a run that does one pass
          # because the arithmetic is wrong must be told apart without reading
          # the code.
          echo "Poll plan: start $(date -u -d "@$started" +%H:%M:%S)Z, budget ${BUDGET_MIN}m, deadline $(date -u -d "@$deadline" +%H:%M:%S)Z, one pass now and one on each 15-minute boundary before it."

          while :; do
            passes=$((passes + 1))
            # Collapsed: a quiet pass is the common case, and eight passes of
            # full output is not a log anyone reads. Warnings are emitted
            # outside the group, so a bad pass is visible without expanding.
            echo "::group::pass $passes — $(date -u +%H:%M:%S)Z"
            ok=1
            if ! refresh_state; then
              ok=0
              echo "::endgroup::"
              echo "::warning::pass $passes could not read current state; skipped without running."
            elif ! timeout 780 python -u press_monitor.py; then
              ok=0
              echo "::endgroup::"
              echo "::warning::pass $passes exited non-zero or timed out; nothing persisted."
            elif ! persist_state; then
              ok=0
              fatal=1
              echo "::endgroup::"
              echo "::error::pass $passes posted but could not persist state. Stopping, because another pass would read the old state and repost."
            else
              echo "::endgroup::"
            fi
            (( ok )) || failed=$((failed + 1))
            if (( fatal )); then break; fi

            if [[ "$POLL" != "true" ]]; then
              echo "Not a scheduled run — single pass."
              break
            fi
            now=$(date -u +%s)
            next=$(( (now / 900 + 1) * 900 ))
            if (( next - now < MIN_GAP )); then
              next=$(( next + 900 ))
            fi
            if (( next > deadline )); then
              echo "Next boundary $(date -u -d "@$next" +%H:%M:%S)Z is past the deadline $(date -u -d "@$deadline" +%H:%M:%S)Z. Stopping after $passes pass(es)."
              break
            fi
            echo "Sleeping until $(date -u -d "@$next" +%H:%M:%S)Z."
            sleep $(( next - now ))
          done

          echo "$passes pass(es), $failed failed, ${BUDGET_MIN}m budget, ran $(( ($(date -u +%s) - started) / 60 ))m."
          (( failed == 0 ))

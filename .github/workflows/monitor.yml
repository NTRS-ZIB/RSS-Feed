name: Press release monitor

on:
  schedule:
    # Every 15 min, weekdays only, 12:00-23:59 UTC.
    # GitHub cron is UTC and has no DST awareness, so this window is set wide
    # enough to cover 8am-6pm Eastern year-round without seasonal edits:
    #   EDT (summer, UTC-4): 8am - 7pm ET
    #   EST (winter, UTC-5): 7am - 6pm ET
    # GitHub queues scheduled jobs at low priority, so expect 15-25 min drift.
    - cron: "*/15 12-23 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate and log without posting or saving state"
        type: boolean
        default: true

permissions:
  contents: write # needed to commit the updated state file

concurrency:
  group: press-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Refresh state from origin
        # A run queued behind another run of this workflow checks out the SHA
        # fixed when the run was CREATED, not when its job started, so state.json
        # on disk can already be a push behind before the component reads it.
        # That stale read is what reposts items to Discord; the retry loop in
        # Persist state only fixes the write. See the trap table in CLAUDE.md.
        # Only the state file is refreshed — the code stays at the checked-out
        # ref, so a dispatch still tests the ref it was dispatched against.
        run: |
          git fetch -q origin "$GITHUB_REF_NAME"
          # Via a temp file: a redirect truncates first, so a failed show
          # would leave an empty state file and repost everything.
          git show "origin/$GITHUB_REF_NAME:state.json" > "$RUNNER_TEMP/origin_state.json"
          mv "$RUNNER_TEMP/origin_state.json" state.json
          if git diff --quiet HEAD -- state.json; then
            echo "State was already current."
          else
            echo "Refreshed state.json from origin; the checkout was behind."
          fi

      - name: Run monitor
        timeout-minutes: 15
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_URL_INSIDER: ${{ secrets.WEBHOOK_URL_INSIDER }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          # Empty on scheduled runs, so those always post.
          DRY_RUN: ${{ inputs.dry_run }}
          PYTHONUNBUFFERED: "1"
        run: python -u press_monitor.py

      - name: Persist state
        # Re-fetch before pushing. A run that was queued behind another checks
        # out the SHA pinned when it was CREATED, so it can hold a state file
        # that is already stale by the time it pushes — see the trap table in CLAUDE.md.
        # Last writer wins, which is correct: each run recomputes state as
        # everything-seen-before plus whatever it just saw, so the later file is
        # a superset.
        run: |
          if [[ -z "$(git status --porcelain state.json)" ]]; then
            echo "No state change."
            exit 0
          fi
          git config user.name "press-monitor"
          git config user.email "actions@github.com"
          cp state.json "$RUNNER_TEMP/state.json"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            cp "$RUNNER_TEMP/state.json" state.json
            if [[ -z "$(git status --porcelain state.json)" ]]; then
              echo "State already current on origin; nothing to push."
              exit 0
            fi
            git add state.json
            git commit -q -m "Update seen items [skip ci]"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "State pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); another run pushed first. Retrying."
            sleep $((attempt * 3))
          done
          echo "Could not persist state.json after 5 attempts." >&2
          exit 1

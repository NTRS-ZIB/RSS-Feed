name: Probe comment letters

# TEMPORARY — delete this file and probe_comment_letters.py once the question
# is answered. It exists to check whether SEC comment letters (UPLOAD and
# CORRESP) carry a filing date recent enough to survive press_monitor.py's age
# filters, before that feature is built.
#
# Read-only: it fetches from data.sec.gov, prints, and exits. No webhook, no
# state, no commit, no schedule. It can only run when started by hand.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Probe
        timeout-minutes: 5
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          PYTHONUNBUFFERED: "1"
        run: python -u probe_comment_letters.py

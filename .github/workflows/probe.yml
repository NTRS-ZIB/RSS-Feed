name: Probe NYISO respondent

# DISPOSABLE — delete with probe_nyiso.py once the answer is recorded.
#
# Establishes whether NYISO can join ERCOT and PJM in grid_context.py: the
# exact respondent code from the facet list, that it carries both D and DF,
# and that its hours are on the same UTC clock as the two existing regions.
#
# Read-only by construction: no schedule, no webhook, no state, no commit,
# and contents: read so it cannot write to the repo even by accident.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Probe
        timeout-minutes: 5
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u probe_nyiso.py

name: Probe sites

# Reads each named company's most recent annual report for grid operators and
# states, and prints every hit with its surrounding sentence.
#
# Manual only, and posts nothing. It resolves the UNSWEPT rows in
# docs/watchlist.md's operating footprint table.
#
# Reach for it whenever a company is added to the roster — UNSWEPT resolves by
# doing this work, and five companies needed it in one week in August 2026 —
# and after a company acquires, energizes or divests a site.
#
# The output is read by a person. Counts narrow the search and excerpts answer
# it, and the SIX TRAPS recorded in probe_sites.py's docstring are every one of
# them invisible to a count: glossary, executive bio, office not site, state is
# not grid, incorporation state, and a single mention carrying the whole
# answer. Four of the five companies swept on 2026-08-06 would have been tagged
# wrongly from the rankings alone.

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Roster tickers to sweep, comma separated"
        type: string
        default: "GLXY,APLD,BTDR,SPCX,ABTC"
      extra:
        description: "Follow-up regexes for a second pass, pipe separated"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read the annual reports
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          SITES_TICKERS: ${{ inputs.tickers }}
          SITES_EXTRA: ${{ inputs.extra }}
        run: python -u probe_sites.py

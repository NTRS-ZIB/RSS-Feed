name: Pushpin

on:
  schedule:
    # 03:40 UTC daily. The 00:00-05:00 window is otherwise empty, which keeps
    # this clear of the two poll-loop workflows that hold a runner for ~45
    # minutes each between 07:00 and 23:59.
    #
    # PUNCTUALITY DOES NOT MATTER HERE and that is unusual for this repo.
    # Scheduled runs on this repo land 51-173 minutes late, measured. Against a
    # 30-day threshold that is 0.2% of the window, and a dropped run means a
    # message dies tomorrow instead of today.
    #
    # It does interact with PUSHPIN_CONDEMN_HOURS=20, and the margin was
    # checked rather than assumed: worst case is a very late run followed by an
    # early one, 24h - 173m + 51m = 21h58m between fires, which still clears
    # 20h. A shorter cron interval would not.
    - cron: "40 3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Classify and log without deleting anything or saving state"
        type: boolean
        default: true
      max_deletes:
        # A PER-DISPATCH CAP, so the cron's own bound is never touched to clear
        # a backlog. The cap exists to stop a logic bug, and raising it in the
        # file to drain an expected backlog is how it stops doing that: the
        # higher number stays behind long after the reason for it is gone.
        #
        # Empty on a schedule event, which env_int reads as the default of 200.
        description: "Override PUSHPIN_MAX_DELETES for this run only. Blank uses 200."
        type: string
        default: ""

permissions:
  contents: write # commits pushpin_state.json

concurrency:
  group: pushpin
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests

      - name: Refresh state from origin
        # A run queued behind another checks out the SHA fixed when the run was
        # CREATED, not when its job started, so pushpin_state.json on disk can
        # already be a push behind before the component reads it. Here that
        # would mean a stale `protected` list, and a stale protected list
        # DELETES A MARKED MESSAGE. See the trap table in CLAUDE.md.
        run: |
          git fetch -q origin "$GITHUB_REF_NAME"
          # The file does not exist until the first live run creates it, and
          # absent is not an error. Via a temp file, because a redirect
          # truncates first and a failed show would leave an empty state file,
          # which reads as "nothing is protected".
          if git show "origin/$GITHUB_REF_NAME:pushpin_state.json" \
               > "$RUNNER_TEMP/origin_state.json" 2>/dev/null; then
            mv "$RUNNER_TEMP/origin_state.json" pushpin_state.json
            if git diff --quiet HEAD -- pushpin_state.json; then
              echo "State was already current."
            else
              echo "Refreshed pushpin_state.json from origin; the checkout was behind."
            fi
          else
            echo "No pushpin_state.json on origin yet; first run will create it."
          fi

      - name: Sweep
        # Bounded by MAX_DELETES=200 and a 0.35s pace, plus two reaction checks
        # per delete candidate, so a full run is single-digit minutes. Longer
        # than that means rate limiting, which is worth seeing rather than
        # hiding behind a generous timeout.
        timeout-minutes: 20
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          PUSHPIN_CHANNEL_ID: ${{ secrets.PUSHPIN_CHANNEL_ID }}
          # Infrastructure noise belongs in ops, not in a market channel.
          WEBHOOK_URL_OPS: ${{ secrets.WEBHOOK_URL_OPS }}
          # ============================================================
          # ROLLOUT, STAGE 2 OF 3, since 2026-10-01.
          #
          # THE CRON IS STILL DRY. A dispatch with the box unticked is
          # LIVE and will permanently delete messages.
          #
          # Stage 1 was the hardcoded literal "true", which could not
          # delete under any circumstances. It earned its keep: 27 dry
          # runs, and the first eligible day exposed a cap deadlock that
          # a live run would have hit instead.
          #
          # Why not go straight to the house pattern, the bare
          # `${{ inputs.dry_run }}`? Because `inputs` is empty on a
          # schedule event, so that line makes the CRON live. It is right
          # for a component whose worst case is a duplicate post, and
          # wrong as a single step here: it would go from "can never
          # delete" to "an unattended 03:40 cron deletes for real" with
          # no state in between where a person can watch a live run.
          #
          #   STAGE 3, only once a supervised live dispatch has been read
          #   and the backlog has drained:
          #     DRY_RUN: ${{ inputs.dry_run }}
          #
          # Do NOT write `${{ inputs.dry_run || 'true' }}`: a deliberately
          # unticked box is boolean false, which is falsy there, so a live
          # dispatch would silently stay dry and this stage would be
          # unreachable.
          # ============================================================
          DRY_RUN: ${{ github.event_name == 'schedule' && 'true' || inputs.dry_run }}
          # Blank on a schedule, which env_int reads as the default 200.
          PUSHPIN_MAX_DELETES: ${{ inputs.max_deletes }}
          PYTHONUNBUFFERED: "1"
        run: python -u pushpin.py

      - name: Persist state
        # ALWAYS, including after a halted Sweep. Without this the step
        # defaults to success() and is skipped on a halt, which throws away
        # every latch that run established: pushpin.py writes `protected` to
        # disk before anything destructive, precisely so a later halt cannot
        # lose it, and a skipped push would undo that inside the runner.
        # A halt before the first write leaves the file untouched, so the
        # no-change guard below exits 0 and nothing is pushed.
        if: always()
        # Re-fetch before pushing. A run queued behind another holds a state
        # file that can already be stale by the time it pushes.
        #
        # LAST WRITER WINS IS NOT SAFE HERE, unlike the other components. Their
        # state is everything-seen-before plus what they just saw, so the later
        # file is a superset. `protected` is also a superset, but `condemned`
        # is not: a run that deleted a message removes it, and a stale file
        # would resurrect the entry. Resurrection is harmless (the delete
        # returns 404 and the entry is dropped), so this is safe by accident
        # rather than by design, and the retry loop below keeps the window
        # small enough that it stays that way.
        run: |
          if [[ -z "$(git status --porcelain pushpin_state.json)" ]]; then
            echo "No state change."
            exit 0
          fi
          git config user.name "pushpin"
          git config user.email "actions@github.com"
          cp pushpin_state.json "$RUNNER_TEMP/pushpin_state.json"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            cp "$RUNNER_TEMP/pushpin_state.json" pushpin_state.json
            if [[ -z "$(git status --porcelain pushpin_state.json)" ]]; then
              echo "State already current on origin; nothing to push."
              exit 0
            fi
            git add pushpin_state.json
            git commit -q -m "Update pushpin state [skip ci]"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "State pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); another run pushed first. Retrying."
            sleep $((attempt * 3))
          done
          echo "Could not persist pushpin_state.json after 5 attempts." >&2
          exit 1

name: Tests

# The offline suites, on every push that touches Python. Before this existed
# NOTHING ran them: the only push-triggered workflow was the list gate, which
# checks that workflows are watched rather than that code works, and
# baseline-test.yml is dispatch-only and runs one file. That left 258 checks
# executing only when a person remembered.
#
# test_baseline.py is deliberately absent. It needs SEC_USER_AGENT and fetches
# data.sec.gov, so it can go red because the SEC is slow, and a red mark that
# fires for reasons outside the repository is how people learn to ignore red
# marks. It keeps baseline-test.yml.
#
# BOTH path patterns are required. Every Python file in this repo is at the
# root, and a filter that misses the root would mean this never fires and never
# says so, which is the failure it exists to end.

on:
  push:
    paths:
      - "*.py"
      - "**/*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # requests is all the suites need, through test_earnings_dates.py's
      # earnings_calendar import. feedparser and matplotlib are for the import
      # step below, which loads every module rather than only the tested eleven.
      - name: Install dependencies
        run: pip install requests feedparser matplotlib
      # The eleven steps below are a hand-maintained list with no gate: add a
      # test_*.py and forget to list it here, and it never runs, silently.
      # That is the same silent-gap shape workflow-list-gate.yml exists to
      # prevent, one level down, so this checks the list against the repo's
      # actual test files before any suite runs, and stays before them so a
      # coverage gap is reported even when a suite below is failing.
      - name: Every suite is run by this workflow
        run: |
          python - <<'PY'
          import glob, re, sys
          EXCLUDED = {"test_baseline.py"}   # live SEC data, runs via baseline-test.yml instead
          wf = open(".github/workflows/tests.yml", encoding="utf-8").read()
          run = set(re.findall(r"python -u (test_\w+\.py)", wf))
          missing = sorted(set(glob.glob("test_*.py")) - run - EXCLUDED)
          if missing:
              sys.exit("Not run by this workflow: " + ", ".join(missing))
          print("All %d suites are run." % len(run))
          PY
      # Only eleven files have suites. These two steps cover all 53, cheaply,
      # and run first because they are the broader check: daily_recap.py is
      # loaded by no suite, directly or transitively, so before this a typo in
      # it merged green. TWENTY-THREE modules are in that position, and the
      # count moves whenever a suite is added — test_weekly_digest.py pulled
      # ftd_monitor, dilution, regsho_volume and short_interest into the
      # covered set without testing any of them directly, which is why the
      # example here was changed at the same time.
      #
      # Counting the suites understates the gap and counting the tested
      # modules overstates it: watchlist.py has no suite of its own but is
      # imported by most of them, so a typo there has always been caught.
      - name: Every module parses
        run: python -m py_compile *.py
      # PARSING IS NOT LOADING, and the gap is most of the value. Importing
      # runs the top of each file, so it catches a missing dependency, a
      # reference to something that no longer exists, and a malformed constant,
      # none of which py_compile notices. Demonstrated: adding a bad import to
      # page_text.py fails SIX modules here and still compiles cleanly.
      - name: Every module imports
        env:
          # A placeholder, not a secret. Four modules refuse to load without
          # it, and none of them fetches anything at import, so nothing is
          # sent anywhere and no real identity is needed. If a module ever
          # starts fetching at import, this step needs rethinking rather than
          # a real value.
          SEC_USER_AGENT: "ci-import-check tests@example.invalid"
        run: |
          python - <<'PY'
          import glob, importlib, sys
          # These two demand configuration the moment they load, so importing
          # them would test the environment rather than the code. test_*.py are
          # run as suites below, and test_baseline.py also exits at import.
          EXCLUDED = {"probe_premarket.py", "probe_sites.py"}
          seen, bad = 0, []
          for f in sorted(glob.glob("*.py")):
              if f.startswith("test_") or f in EXCLUDED:
                  continue
              seen += 1
              try:
                  importlib.import_module(f[:-3])
              except BaseException as e:
                  bad.append("%s: %s: %s" % (f, type(e).__name__, e))
          if bad:
              sys.exit("Modules that do not import:\n  " + "\n  ".join(bad))
          print("All %d modules import." % seen)
          PY
      # One step per suite so a failure is named in the run's step list and
      # nobody has to open a log to learn which one broke.
      - name: filing_cadence
        run: python -u test_filing_cadence.py
      - name: build_snapshot
        run: python -u test_build_snapshot.py
      - name: first_run
        run: python -u test_first_run.py
      - name: page_text
        run: python -u test_page_text.py
      - name: press_monitor
        run: python -u test_press_monitor.py
      - name: weekly_digest
        run: python -u test_weekly_digest.py
      - name: earnings_dates
        run: python -u test_earnings_dates.py
      - name: probe_body_dates
        run: python -u test_probe_body_dates.py
      - name: loop_state
        run: python -u test_loop_state.py
      - name: loop_verdict
        run: python -u test_loop_verdict.py
      - name: loop_approval
        run: python -u test_loop_approval.py
      - name: pushpin
        run: python -u test_pushpin.py
      # NOT A SUITE, and the reason is the same one the cadence branch check
      # below carries: on the only component that destroys, a green suite is
      # not evidence. This applies each of the fourteen named one-line changes
      # to pushpin.py in its own temp directory and asserts every one reddens
      # a check. It caught two real problems on its first run: a harness bug
      # that made all fourteen report SILENT (PYTHONPATH loses to the script's
      # own directory at sys.path[0], so no mutant was ever imported), and one
      # check that asserted "halts" rather than "halts for this reason" and
      # therefore could not fail.
      #
      # IT GOES RED WHEN A MUTATION STOPS APPLYING, which is the signal rather
      # than a false alarm: an anchor that no longer matches means the
      # mutation is not testing what it claims. Fix the anchor, do not delete
      # the step. Offline, about 30 seconds.
      - name: every pushpin guard fails when removed
        run: python -u test_pushpin.py --sweep
      # NOT A SUITE, and it is here for the reason the corpus exists at all.
      # probe_cadence_corpus.py compares the cadence rule before and after a
      # change, and its result is worth nothing if the grid cannot reach the
      # branch that moved: the first version of it reported no differences
      # over 3,382 cases while entering the two branches most likely to move
      # zero times. `--branches` runs the grid and asserts coverage without
      # comparing anything, so the guard that makes the corpus meaningful is
      # itself checked rather than taken on trust. Offline and under a second.
      #
      # IT CAN GO RED ON A CORRECT CHANGE, and that is the signal rather than
      # a false alarm: a change that makes one of the seventeen branches
      # unreachable is one the corpus can no longer measure. Reach for
      # BRANCHES and the module docstring, not for deleting this step.
      - name: cadence corpus reaches every branch it claims
        run: python -u probe_cadence_corpus.py --branches

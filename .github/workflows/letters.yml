name: SEC comment letters

on:
  schedule:
    # 13:30 UTC weekdays. EDGAR publishes correspondence on business days, and
    # nothing here is urgent — the SEC releases it at least 20 business days
    # after a review completes, so a letter is already weeks old when it
    # appears. Daily is generous.
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and log without posting or saving state"
        type: boolean
        default: true

permissions:
  contents: write   # commits letters_state.json

concurrency:
  group: comment-letters
  cancel-in-progress: false

jobs:
  letters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check comment letters
        # One submissions request per company, eleven in total.
        timeout-minutes: 5
        env:
          # Filings channel: these are SEC filings, not market data.
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DRY_RUN: ${{ inputs.dry_run }}
          PYTHONUNBUFFERED: "1"
        run: python -u comment_letters.py

      - name: Persist state
        # Re-fetch before pushing. A run that was queued behind another checks
        # out the SHA pinned when it was CREATED, so it can hold a state file
        # that is already stale by the time it pushes — see the trap table in CLAUDE.md.
        # Last writer wins, which is correct: each run recomputes state as
        # everything-seen-before plus whatever it just saw, so the later file is
        # a superset.
        run: |
          if [[ -z "$(git status --porcelain letters_state.json)" ]]; then
            echo "No state change."
            exit 0
          fi
          git config user.name "comment-letters"
          git config user.email "actions@github.com"
          cp letters_state.json "$RUNNER_TEMP/letters_state.json"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            cp "$RUNNER_TEMP/letters_state.json" letters_state.json
            if [[ -z "$(git status --porcelain letters_state.json)" ]]; then
              echo "State already current on origin; nothing to push."
              exit 0
            fi
            git add letters_state.json
            git commit -q -m "Update comment letter state [skip ci]"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "State pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); another run pushed first. Retrying."
            sleep $((attempt * 3))
          done
          echo "Could not persist letters_state.json after 5 attempts." >&2
          exit 1

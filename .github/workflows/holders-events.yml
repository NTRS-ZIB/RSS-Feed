name: Holder events

# Schedule 13D/G holder events -> the insider channel.
#
# Arrival, change and declared exit. It never counts holders and never reports
# a departure by inference — see holder_events.py for both refusals and the
# measurements behind them.
#
# NOT A DUPLICATE OF THE PRESS MONITOR. That component posts every 13D/G to the
# main filings channel because both spellings are in its FORM_TYPES; it
# announces that a filing exists. This one reads it. Different channels, so the
# pair never reads as a double post.

on:
  schedule:
    - cron: "45 13 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate and log without posting or saving state"
        type: boolean
        default: true

concurrency:
  group: holder-events
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      # A queued run checks out the SHA fixed when it was created, so without
      # this it can load a state file older than the tip and repost. That is
      # the duplicate-post incident of 2026-08-04.
      - name: Pull before reading state
        run: git pull --ff-only origin "$GITHUB_REF_NAME" || true

      - name: Read 13D/G filings
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          WEBHOOK_URL_INSIDER: ${{ secrets.WEBHOOK_URL_INSIDER }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
        run: python -u holder_events.py

      - name: Persist state
        # ALWAYS, and gated on the DRY RUN rather than on the EVENT. Two
        # defects lived in the one line this replaces.
        #
        # A step `if:` containing no status-check function carries an implicit
        # success(), so `github.event_name == 'schedule'` read as
        # `success() && ...` and was SKIPPED whenever the python step failed.
        # holder_events returns 1 on a partial post failure, so the whole run's
        # state was discarded and every embed that HAD posted was reposted on
        # the next run: the 2026-08-04 duplicate incident reached by a
        # different route. pushpin.yml:114 already carries always() for the
        # same reason.
        #
        # And the event test was the wrong question. DRY_RUN below resolves to
        # inputs.dry_run on a dispatch, so unticking the box posted live to
        # Discord and then never saved, guaranteeing a repost. Seven dispatches
        # have run and all seven were dry, so this has never fired.
        #
        # `!inputs.dry_run` on a SCHEDULE is measured rather than assumed: the
        # inputs context is unpopulated there, and snapshot.yml:56 carries the
        # same expression on a scheduled workflow whose "Commit if changed"
        # step reports `success` rather than `skipped` and whose snapshot.json
        # is committed daily.
        #
        # SAFE ONLY BECAUSE holder_events.py CHANGED FIRST. always() is what
        # puts a failed run's state on disk, so the failed-post path had to
        # roll back the holders baseline as well as `seen`, and save_state had
        # to become atomic, before this line could move.
        if: ${{ always() && !inputs.dry_run }}
        run: |
          git config user.name "holder-bot"
          git config user.email "holder-bot@users.noreply.github.com"
          # NEVER COMMIT A FILE WE CANNOT READ BACK. always() means this step
          # now runs after a killed or failed python step, and a run stopped
          # mid-write by the job timeout would otherwise commit a truncated
          # state file, which the next run reads as a JSON error and treats as
          # a cold start. save_state writes atomically; this is the second belt.
          python -c "import json,sys; json.load(open('holder_state.json'))"             || { echo "holder_state.json is not readable JSON, refusing to commit" >&2; exit 1; }
          git add holder_state.json
          if git diff --cached --quiet; then
            echo "No state change."
            exit 0
          fi
          cp holder_state.json "$RUNNER_TEMP/holder_state.json"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            cp "$RUNNER_TEMP/holder_state.json" holder_state.json
            git add holder_state.json
            if git diff --cached --quiet; then
              echo "Already current on origin."
              exit 0
            fi
            git commit -q -m "Update holder state [skip ci]"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "State pushed on attempt $attempt."
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "Could not persist holder_state.json after 5 attempts." >&2
          exit 1

name: Probe IR feeds

# Do the five 2026-08-05 additions have IR feeds? Manual, posts nothing,
# changes no roster entry.
#
# Autodiscovery before guessing, because WYFI's feed is on a different host
# and this repo concluded "no feed" twice by checking only the company domain.
#
# Newest item date before structure, because DGXX's old wire feed parsed
# perfectly and was seven months stale.
#
# parse_feed() rather than feedparser, so the check uses the component's own
# headers and retry. MARA is the control: a harness that has never passed
# proves nothing about the failures it reports.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet feedparser requests
      - run: python -u probe_feeds.py

name: Daily market recap

on:
  schedule:
    # 21:30 UTC, weekdays. GitHub cron is UTC with no DST awareness, so this
    # single time lands after the US close in both halves of the year:
    #   EDT (summer, UTC-4): 5:30pm ET
    #   EST (winter, UTC-5): 4:30pm ET
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and log the recap without posting to Discord"
        type: boolean
        default: true

concurrency:
  group: daily-recap
  cancel-in-progress: false

jobs:
  recap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests matplotlib

      - name: Build and post recap
        timeout-minutes: 15
        env:
          WEBHOOK_URL_MARKET: ${{ secrets.WEBHOOK_URL_MARKET }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          # Empty on scheduled runs, so those always post.
          DRY_RUN: ${{ inputs.dry_run }}
          PYTHONUNBUFFERED: "1"
        run: python -u daily_recap.py

      - name: Upload chart
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recap-chart
          path: recap.png
          if-no-files-found: ignore
          retention-days: 7

name: Volume spikes

on:
  schedule:
    # Every 15 min, weekdays, 11:00-22:59 UTC. Covers premarket through the
    # close in both DST states:
    #   EDT (summer, UTC-4): 7am - 6pm ET
    #   EST (winter, UTC-5): 6am - 5pm ET
    # Alpaca's free tier includes extended hours, so premarket gaps are caught.
    - cron: "*/15 11-22 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check ratios and log them without posting or saving state"
        type: boolean
        default: true

permissions:
  contents: write   # commits spike_state.json

concurrency:
  group: volume-spikes
  cancel-in-progress: false

jobs:
  spikes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check volumes
        timeout-minutes: 5
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          WEBHOOK_URL_ALERTS: ${{ secrets.WEBHOOK_URL_ALERTS }}
          WEBHOOK_URL_MARKET: ${{ secrets.WEBHOOK_URL_MARKET }}
          DRY_RUN: ${{ inputs.dry_run }}
          PYTHONUNBUFFERED: "1"
        run: python -u volume_spike.py

      - name: Persist state
        # Re-fetch before pushing. A run that was queued behind another checks
        # out the SHA pinned when it was CREATED, so it can hold a state file
        # that is already stale by the time it pushes — see the trap table in CLAUDE.md.
        # Last writer wins, which is correct: each run recomputes state as
        # everything-seen-before plus whatever it just saw, so the later file is
        # a superset.
        run: |
          if [[ -z "$(git status --porcelain spike_state.json)" ]]; then
            echo "No state change."
            exit 0
          fi
          git config user.name "volume-spikes"
          git config user.email "actions@github.com"
          cp spike_state.json "$RUNNER_TEMP/spike_state.json"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            cp "$RUNNER_TEMP/spike_state.json" spike_state.json
            if [[ -z "$(git status --porcelain spike_state.json)" ]]; then
              echo "State already current on origin; nothing to push."
              exit 0
            fi
            git add spike_state.json
            git commit -q -m "Update spike state [skip ci]"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "State pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); another run pushed first. Retrying."
            sleep $((attempt * 3))
          done
          echo "Could not persist spike_state.json after 5 attempts." >&2
          exit 1

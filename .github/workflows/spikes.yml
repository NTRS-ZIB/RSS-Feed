name: Volume spikes

on:
  schedule:
    # Once an hour, weekdays, 07:00-22:59 UTC; the job itself then checks on
    # each fifteen-minute boundary until its hour is out. See the poll step for
    # why the granularity moved off the cron and onto the job.
    #
    # Covers premarket through the close in both DST states:
    #   EDT (summer, UTC-4): 3am - 6pm ET
    #   EST (winter, UTC-5): 2am - 5pm ET
    # Alpaca's free tier includes extended hours, so premarket gaps are caught.
    #
    # 07:09 is a MECHANICAL STAGGER two minutes off the press monitor, not a
    # measured choice. The monitor's 07:07 is justified by a filing-time
    # distribution; there is no equivalent measurement for when volume spikes
    # occur, and spike_state.json keeps only the current day, so no history
    # exists to derive one from. The cost of a late start here is also
    # different in kind: hourly bars cover the whole 4am-8pm ET extended
    # session, so a run starting late still SEES earlier premarket volume in
    # the cumulative total. It alerts later; it is not blind.
    #
    # To choose this number on evidence rather than on the monitor's, the
    # thing to measure is when alerts actually fire. That needs spike_state
    # to retain history, which it does not.
    - cron: "9 7-22 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check ratios and log them without posting or saving state"
        type: boolean
        default: true
      poll:
        description: "Take the poll loop rather than a single pass. Pair with dry_run to exercise the loop against live data without posting."
        type: boolean
        default: false

permissions:
  contents: write   # commits spike_state.json

concurrency:
  group: volume-spikes
  cancel-in-progress: false

jobs:
  spikes:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Poll on each fifteen-minute boundary until the hour is out
        # One scheduled fire an hour, not four. GitHub drops scheduled runs
        # under load and, by its own documentation, drops them hardest at the
        # top of the hour; of the */15 fires this workflow asked for, roughly
        # 5% actually ran. So ask once and supply the fifteen-minute
        # granularity here, where GitHub cannot drop it. The fire is at :07
        # rather than :00 for the same reason.
        #
        # State is re-read and pushed once per pass, not once per job. A job
        # that loaded state at startup and looped would be as stale by pass
        # eight as a queued run is at job start — the same bug, smaller.
        #
        # A dispatch runs a single pass. Looping for an hour on a manual dry
        # run holds a runner and shows nothing the first pass did not.
        # BUDGET_MIN + the per-pass timeout below + slack.
        timeout-minutes: 65
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          WEBHOOK_URL_ALERTS: ${{ secrets.WEBHOOK_URL_ALERTS }}
          WEBHOOK_URL_MARKET: ${{ secrets.WEBHOOK_URL_MARKET }}
          DRY_RUN: ${{ inputs.dry_run }}
          # True on the cron; a dispatch does one pass unless it asks for
          # the loop. A dispatch cannot otherwise exercise the loop at all,
          # and 'no pass reposts what the last one posted' is a multi-pass
          # property that no single-pass run can demonstrate.
          POLL: ${{ github.event_name == 'schedule' || inputs.poll }}
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name "volume-spikes"
          git config user.email "actions@github.com"

          # Explicit `|| return 1` on every line: these functions are called
          # from `if !`, which suspends `set -e` for everything they run.
          refresh_state() {
            local before after
            before=$(sha1sum spike_state.json | cut -d" " -f1) || return 1
            git fetch -q origin "$GITHUB_REF_NAME" || return 1
            # Via a temp file — a redirect truncates first, so a failed show
            # would leave an empty state file and repost everything.
            git show "origin/$GITHUB_REF_NAME:spike_state.json" \
              > "$RUNNER_TEMP/origin_state.json" || return 1
            mv "$RUNNER_TEMP/origin_state.json" spike_state.json || return 1
            after=$(sha1sum spike_state.json | cut -d" " -f1) || return 1
            # Reported every pass, either way. "Already current" on every
            # run for weeks would mean this guard has never once been
            # exercised in the case it exists for, which is worth knowing.
            # On pass 1 a difference means the checkout was behind; on
            # later passes it means another run pushed mid-loop.
            if [[ "$before" == "$after" ]]; then
              echo "State was already current."
            else
              echo "Refreshed spike_state.json from origin; what was on disk was behind."
            fi
          }

          persist_state() {
            if [[ -z "$(git status --porcelain spike_state.json)" ]]; then
              echo "No state change."
              return 0
            fi
            cp spike_state.json "$RUNNER_TEMP/spike_state.json" || return 1
            for attempt in 1 2 3 4 5; do
              git fetch -q origin "$GITHUB_REF_NAME" || return 1
              git reset -q --hard "origin/$GITHUB_REF_NAME" || return 1
              cp "$RUNNER_TEMP/spike_state.json" spike_state.json || return 1
              if [[ -z "$(git status --porcelain spike_state.json)" ]]; then
                echo "State already current on origin; nothing to push."
                return 0
              fi
              git add spike_state.json || return 1
              git commit -q -m "Update spike state [skip ci]" || return 1
              if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
                echo "State pushed on attempt $attempt."
                return 0
              fi
              echo "Push rejected (attempt $attempt); another run pushed first. Retrying."
              sleep $((attempt * 3))
            done
            echo "Could not persist spike_state.json after 5 attempts." >&2
            return 1
          }

          # The budget is elapsed time from THIS job's start, not the top of
          # the next hour. Measured on this repo: every scheduled run is 51 to
          # 173 minutes late, so a fire nominally at :07 arrives near :59 —
          # and a wall-clock-hour deadline then granted it seconds of budget
          # instead of an hour. On 2026-08-04 six seconds of job-start jitter
          # was the difference between four passes and one, and the one-pass
          # run would have printed "1 pass(es), 0 failed" and read as success.
          # Elapsed budget is immune to where in the hour the job starts.
          #
          # 55m sits just under the 61m mean arrival gap in the afternoon
          # regime. Mornings run 83-173m late, so a gap is expected there; the
          # budget VALUE is a separate question from the budget FRAME, and
          # only the frame is being fixed here.
          BUDGET_MIN=55
          # A boundary this close is the same check twice — skip to the next.
          MIN_GAP=180
          started=$(date -u +%s)
          deadline=$(( started + BUDGET_MIN * 60 ))
          passes=0
          failed=0
          fatal=0

          # Stated up front so a short run is self-explaining. A run that does
          # one pass because it started at :50 and a run that does one pass
          # because the arithmetic is wrong must be told apart without reading
          # the code.
          echo "Poll plan: start $(date -u -d "@$started" +%H:%M:%S)Z, budget ${BUDGET_MIN}m, deadline $(date -u -d "@$deadline" +%H:%M:%S)Z, one pass now and one on each 15-minute boundary before it."

          while :; do
            passes=$((passes + 1))
            # Collapsed: a quiet pass is the common case, and eight passes of
            # full output is not a log anyone reads. Warnings are emitted
            # outside the group, so a bad pass is visible without expanding.
            echo "::group::pass $passes — $(date -u +%H:%M:%S)Z"
            ok=1
            if ! refresh_state; then
              ok=0
              echo "::endgroup::"
              echo "::warning::pass $passes could not read current state; skipped without running."
            elif ! timeout 300 python -u volume_spike.py; then
              ok=0
              echo "::endgroup::"
              echo "::warning::pass $passes exited non-zero or timed out; nothing persisted."
            elif ! persist_state; then
              ok=0
              fatal=1
              echo "::endgroup::"
              echo "::error::pass $passes posted but could not persist state. Stopping, because another pass would read the old state and repost."
            else
              echo "::endgroup::"
            fi
            (( ok )) || failed=$((failed + 1))
            if (( fatal )); then break; fi

            if [[ "$POLL" != "true" ]]; then
              echo "Not a scheduled run — single pass."
              break
            fi
            now=$(date -u +%s)
            next=$(( (now / 900 + 1) * 900 ))
            if (( next - now < MIN_GAP )); then
              next=$(( next + 900 ))
            fi
            if (( next > deadline )); then
              echo "Next boundary $(date -u -d "@$next" +%H:%M:%S)Z is past the deadline $(date -u -d "@$deadline" +%H:%M:%S)Z. Stopping after $passes pass(es)."
              break
            fi
            echo "Sleeping until $(date -u -d "@$next" +%H:%M:%S)Z."
            sleep $(( next - now ))
          done

          echo "$passes pass(es), $failed failed, ${BUDGET_MIN}m budget, ran $(( ($(date -u +%s) - started) / 60 ))m."
          (( failed == 0 ))

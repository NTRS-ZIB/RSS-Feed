name: Morning coverage probe

# TEMPORARY research tool. Read-only: fetches EDGAR acceptance times, runs a
# coverage simulation, prints tables, exits. No webhook, no state, no commit,
# no schedule. Delete with probe_morning_coverage.py once the poller's window
# start and BUDGET_MIN are decided.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Probe
        timeout-minutes: 20
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          PYTHONUNBUFFERED: "1"
        run: python -u probe_morning_coverage.py

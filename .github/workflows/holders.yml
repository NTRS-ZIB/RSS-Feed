name: Probe holders

# Temporary probe. Can holder concentration be backfilled from EDGAR 13D/G?
# Posts nothing, writes nothing, decides nothing — the output is read.
#
# The phases each bound the next: inventory, structured, legacy, timeline.
# The timeline one decided whether there was anything to build, since a roster
# of three institutions that never change reports a constant.
#
# SUBJECTS is not part of that sequence and answers a later question. EDGAR
# lists a Schedule 13D/G under every reporting person's CIK as well as the
# subject's, and holder_events labels each filing with the roster ticker it was
# read under, so a company that files about somebody else is recorded as
# holding a stake in itself. Run 31810564097 published nine such embeds on
# 2026-08-14. This phase measures where the subject CIK lives, which filings
# are misattributed, and what a pagination fix would newly reveal.

on:
  workflow_dispatch:
    inputs:
      phase:
        # Was "inventory | structured | legacy | timeline" until 2026-09-10,
        # which had been wrong since the fifth phase was added: a dispatcher
        # offering four of eight options is how a phase nobody lists stops
        # being run.
        description: >-
          inventory | structured | legacy | timeline | census | questions |
          groups | eventdate | subjects
        type: string
        default: "inventory"
      tickers:
        description: "Limit to these tickers, comma separated. Blank = all 19."
        type: string
        default: ""
      max_docs:
        description: "Ceiling on document fetches; reported when hit"
        type: string
        default: "400"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Probe
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          HOLDERS_PHASE: ${{ inputs.phase }}
          HOLDERS_TICKERS: ${{ inputs.tickers }}
          HOLDERS_MAX_DOCS: ${{ inputs.max_docs }}
        run: python -u probe_holders.py

name: Probe sites

# TEMPORARY — delete this file and probe_sites.py once the facility mapping is
# recorded. Read-only: fetches annual reports from EDGAR, prints, exits. No
# webhook, no state, no commit, no schedule.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Probe
        # Annual reports are large; eleven of them sequentially.
        timeout-minutes: 20
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          PYTHONUNBUFFERED: "1"
        run: python -u probe_sites.py

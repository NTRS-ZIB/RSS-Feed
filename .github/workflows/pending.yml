name: Pending filings

# Reports filings a roster change put permanently out of reach.
#
# NOT ON A SCHEDULE, AND THAT IS THE DESIGN. A "no run in N hours" heartbeat
# was measured and rejected: GitHub drops 30-45% of scheduled fires on this
# repo, so a scheduled checker inherits the unreliability it exists to report,
# and the healthy and broken gap distributions overlap so completely that no
# threshold separates them. See docs/rejected.md.
#
# This fires on a push touching watchlist.py, which is not scheduled and so
# does not inherit that drop rate, and which is the exact moment the loss is
# created rather than an interval afterwards. The trigger is the cause.
#
# It is silent unless a company was added AND some of its filings had already
# passed the age floor. An ordinary roster edit, a CUSIP correction or an
# added alternate symbol produces no output at all.

on:
  push:
    paths:
      - 'watchlist.py'
  workflow_dispatch:
    inputs:
      since:
        description: "Ref to compare the roster against"
        type: string
        default: "HEAD^"
      dry_run:
        description: "Evaluate and log without posting"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pending
  cancel-in-progress: false

jobs:
  pending:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # HEAD^ has to exist for the default comparison, and a shallow
          # checkout would not carry it. Two commits is all this needs.
          fetch-depth: 2

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        # press_monitor is imported for the uid format and the two windows,
        # and it imports feedparser and requests at module level.
        run: pip install requests feedparser

      - name: Check for filings lost to the roster change
        timeout-minutes: 10
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          WEBHOOK_URL_OPS: ${{ secrets.WEBHOOK_URL_OPS }}
          DRY_RUN: ${{ inputs.dry_run }}
          PYTHONUNBUFFERED: "1"
        run: python -u audit_pending.py --since "${{ inputs.since || 'HEAD^' }}"

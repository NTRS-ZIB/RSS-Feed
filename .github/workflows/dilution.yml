name: Shares outstanding

on:
  schedule:
    # 15:00 UTC weekdays. Share counts change when a company files, so this
    # checks daily and posts only when a reported figure moves. In practice
    # that is roughly quarterly per company, clustered around reporting season.
    - cron: "0 15 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and log without posting or saving state"
        type: boolean
        default: true

permissions:
  contents: write   # commits dilution_state.json

concurrency:
  group: dilution
  cancel-in-progress: false

jobs:
  dilution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Check shares outstanding
        # One companyconcept request per company, plus a retry per fallback
        # concept for any filer that does not tag the first one.
        timeout-minutes: 5
        env:
          WEBHOOK_URL_MARKET: ${{ secrets.WEBHOOK_URL_MARKET }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DRY_RUN: ${{ inputs.dry_run }}
          PYTHONUNBUFFERED: "1"
        run: python -u dilution.py

      - name: Persist state
        # Re-fetch before pushing. A run that was queued behind another checks
        # out the SHA pinned when it was CREATED, so it can hold a state file
        # that is already stale by the time it pushes — see the trap table in CLAUDE.md.
        # Last writer wins, which is correct: each run recomputes state as
        # everything-seen-before plus whatever it just saw, so the later file is
        # a superset.
        run: |
          if [[ -z "$(git status --porcelain dilution_state.json)" ]]; then
            echo "No state change."
            exit 0
          fi
          git config user.name "dilution"
          git config user.email "actions@github.com"
          cp dilution_state.json "$RUNNER_TEMP/dilution_state.json"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            cp "$RUNNER_TEMP/dilution_state.json" dilution_state.json
            if [[ -z "$(git status --porcelain dilution_state.json)" ]]; then
              echo "State already current on origin; nothing to push."
              exit 0
            fi
            git add dilution_state.json
            git commit -q -m "Update dilution state [skip ci]"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "State pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); another run pushed first. Retrying."
            sleep $((attempt * 3))
          done
          echo "Could not persist dilution_state.json after 5 attempts." >&2
          exit 1

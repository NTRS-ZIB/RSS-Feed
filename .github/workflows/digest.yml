name: Weekly digest

# Posts the weekly digest to #weekly-digest and commits digest/<week>.md and
# .json, once per ISO week.
#
# DAILY, NOT WEEKLY, AND THE REASON IS MEASURED. Over the run history of
# 2026-07-29 to 2026-08-05 the daily workflows delivered 3-4 of their 5-6
# nominal scheduled fires; docs/rejected.md records the rate as GitHub dropping
# 30-45% of scheduled fires on this repo. A once-a-week cron therefore has
# roughly even odds of simply not running, and nobody would notice until the
# following Saturday. So it fires every day and gates on "have I already
# produced ISO week N?" — the same shape short_interest.py and ftd_monitor.py
# have used for months to post twice a month off a daily check.
#
# 17:00 UTC, AND THE HOUR IS OFF THE DELAY DISTRIBUTION RATHER THAN
# CONVENIENCE. Scheduled runs here are never on time and the lateness is
# bimodal: 83-173 minutes in the 05:00-15:59 UTC window against 51-71 in the
# 16:00-23:59 one (docs/press-monitor.md). Firing in the afternoon regime costs
# about an hour and a half less drift, and drift is drop exposure. 17:00 lands
# around 17:51-18:11.
#
# SATURDAY IS THE FIRST ELIGIBLE DAY, and that falls out of the gate rather
# than the cron: recent_weeks() only returns a week once its Friday has passed.
# Friday's short volume is not available on Friday evening — FINRA is T+1 and
# regsho.yml runs at 23:00 UTC for the PREVIOUS trade date — so a Friday digest
# would be a four-day week reported as five.
#
# A Saturday that drops is picked up by Sunday's fire, or Monday's, all
# targeting the same week. That is the whole point of the daily cadence.

on:
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Evaluate and log without posting or committing"
        type: boolean
        default: true
      backfill:
        description: "Complete ISO weeks to derive. 0 skips the backfill."
        type: string
        default: "0"
      render:
        description: "ISO weeks to dry-run both renderings for, comma separated"
        type: string
        default: ""

# At most one run is ever pending, and a newer arrival CANCELS the older
# pending one, so the survivor is always the one with the freshest checkout.
# Do not try to detect supersession in the job — the platform does it, and a
# run that does start is not doing stale work anyway: "has week N been
# produced" is a timeless question.
concurrency:
  group: weekly-digest
  cancel-in-progress: false

permissions:
  contents: write # digest/<week>.md and .json

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # feedparser is not used by weekly_digest.py directly. It is a
      # dependency of press_monitor.py, which is imported for the 8-K item
      # taxonomy — ALWAYS_POST_ITEMS carries measurements over 1,986 filings
      # and a second copy of it would drift the first time either file was
      # edited alone.
      - name: Install dependencies
        run: pip install requests feedparser

      # THE GATE READS THE WORKING TREE, so the working tree has to be current.
      # A queued run checks out the SHA fixed when the run was CREATED, not
      # when its job starts, so without this it can ask "has this week been
      # produced?" of a tip that already answers yes — and post again. That is
      # the mechanism behind the duplicate-post incident of 2026-08-04, where
      # two runs were serialised exactly as the concurrency group intended and
      # the second still began from the commit before the first one's push.
      # A dispatch asking for a backfill or a render is a measurement, not a
      # production run, and must not also take the live path — the first
      # version's condition let it, which on a non-dry dispatch would have
      # posted.
      - name: Pull before reading the gate
        if: >-
          github.event_name == 'schedule'
          || (inputs.render == ''
              && (inputs.backfill == '0' || inputs.backfill == ''))
        run: git pull --ff-only origin "$GITHUB_REF_NAME" || true

      - name: Produce the week
        if: >-
          github.event_name == 'schedule'
          || (inputs.render == ''
              && (inputs.backfill == '0' || inputs.backfill == ''))
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          WEBHOOK_URL_DIGEST: ${{ secrets.WEBHOOK_URL_DIGEST }}
          # A scheduled fire is live. A dispatch defaults to a dry run, which
          # posts nothing and writes nothing — per the trap table, DRY_RUN has
          # to skip the commit as well as the post, or a dry run closes the
          # gate and suppresses the real one.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          DIGEST_LIVE: "1"
        run: python -u digest_render.py

      # Only ever adds a file for a week that has none. Last writer does NOT
      # win here — unlike snapshot.json, which is rebuilt whole every run, a
      # week file is written once and never rewritten, so the retry re-applies
      # this run's new file onto whatever else landed meanwhile.
      - name: Commit the week
        if: github.event_name == 'schedule'
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add digest/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No new week file — either already produced, or the post did not go out."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/digest"
          cp digest/*.md digest/*.json "$RUNNER_TEMP/digest/"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            mkdir -p digest
            cp "$RUNNER_TEMP"/digest/* digest/
            git add digest/
            if git diff --cached --quiet; then
              echo "Already on origin; nothing to push."
              exit 0
            fi
            git commit -q -m "Weekly digest [skip ci]"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); another run pushed first. Retrying."
            sleep $((attempt * 3))
          done
          # THE POST HAS ALREADY GONE OUT. Without the file the gate stays
          # open and tomorrow's run posts the same week again. Failing loudly
          # turns a silent duplicate-tomorrow into a notice today.
          echo "Could not persist the week file after 5 attempts. The post is" >&2
          echo "already sent, so tomorrow's run will repeat it unless this is" >&2
          echo "resolved by hand." >&2
          exit 1

      - name: Derive the verdict record
        if: inputs.backfill != '0' && inputs.backfill != ''
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DIGEST_BACKFILL: ${{ inputs.backfill }}
        run: python -u weekly_digest.py

      # DRY RUN ONLY. DIGEST_WRITE is unset, so both renderings are printed in
      # full and neither is written. The step FAILS if the post breaks any of
      # its limits — the 4,096-character description, the 1,024-character
      # field, the 6,000-character embed, or the 28-character monospace
      # ceiling. Discord accepts an over-wide code block silently and wraps it
      # on mobile, which is why the check has to live here rather than in the
      # reading of the post.
      - name: Dry-run both renderings
        if: inputs.render != ''
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          DIGEST_WEEKS: ${{ inputs.render }}
        run: python -u digest_render.py

      # A source that failed leaves a hole a reader must be told about, and the
      # record carries the per-source status precisely so nothing downstream
      # can mistake it for silence. Surfacing it here as well means a run that
      # LOOKS complete in the log cannot be read as complete when it was not.
      - name: Report any source that did not answer
        if: inputs.backfill != '0' && inputs.backfill != ''
        run: |
          python - <<'PY'
          import json
          d = json.load(open("digest_backfill.json"))
          weeks = d["weeks"]
          bad = {k: v for k, v in weeks[0]["sources"].items()
                 if v["status"] not in ("ok", "partial")}
          print("%d weeks, %d requests, %.1fs of fetching"
                % (len(weeks), d["total_requests"], d["fetch_seconds"]))
          for k, v in sorted(weeks[0]["sources"].items()):
              print("  %-16s %-12s %s" % (k, v["status"], v["note"]))
          if bad:
              print("\nSources that did not answer: %s" % ", ".join(sorted(bad)))
              print("Every contributor resting on them is absent from the "
                    "denominator, so the distribution above is measured over "
                    "fewer components than the registry holds. Do not set a "
                    "threshold from it.")
          PY

      - uses: actions/upload-artifact@v4
        if: inputs.backfill != '0' && inputs.backfill != ''
        with:
          name: digest-backfill
          path: digest_backfill.json
          retention-days: 30

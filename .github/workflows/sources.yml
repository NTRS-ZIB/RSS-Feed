name: Probe sources

# GLXY's /all-news/announcements, and a proper scope for ABTC.
# Manual, posts nothing, changes no roster entry.
#
# GLXY: the question is not whether the Helios release is on that page, it is
# whether "company announcement" and "third-party article about the company"
# are separable by MARKUP there — and if the separation is editorial instead,
# that is a source that can silently change what it includes.
#
# ABTC: four routes — slugs, sitemap lastmod, the backing API behind the
# infinite scroll, and ld+json on an individual release page. Each is judged
# on whether its failure is distinguishable from a quiet week.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet feedparser requests
      - run: python -u probe_sources.py
      - name: Part two — the two leads part one turned up
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -u probe_sources2.py

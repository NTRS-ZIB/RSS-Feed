name: Baseline rule test

# Demonstrates baseline_companies() against the real 2026-08-05 roster
# addition, with the guard removed and with it in place. Posts nothing.
#
# CLAUDE.md: a test that has never failed proves nothing. Every case runs both
# paths over the same items so the failure being prevented is visible rather
# than asserted.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --quiet feedparser requests
      - env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python -u test_baseline.py

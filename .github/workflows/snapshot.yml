name: Build snapshot

# Writes snapshot.json: a dated restatement of what each watched issuer's EDGAR
# submissions index holds. Written for the sibling equity-research project as an
# index to the filings, never as a substitute for reading them. NOT YET WIRED:
# that project's reader takes a mandatory path and nothing supplies one, so the
# file currently has no live consumer. It is public and rewritten daily, so it
# is still a contract.

on:
  schedule:
    - cron: "0 11 * * 1-5"   # 11:00 UTC weekdays, before the US open
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Fetch and report what would change, write nothing"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build snapshot.json
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python build_snapshot.py

      - name: Confirm the file was written and is not empty of issuers
        # Skipped on a dry run, which writes nothing: this would otherwise
        # validate the PREVIOUS file and report it as this run's result.
        if: ${{ !inputs.dry_run }}
        run: |
          test -f snapshot.json || { echo "build_snapshot.py wrote no snapshot.json"; exit 1; }
          python - <<'PY'
          import json, sys
          d = json.load(open("snapshot.json"))
          n = len(d.get("issuers", {}))
          bad = sum(1 for v in d["issuers"].values() if "error" in v)
          print("issuers: %d, with errors: %d, generated %s" % (n, bad, d.get("generated")))
          if n == 0 or bad == n:
              sys.exit("Snapshot holds no usable issuer. Not committing.")
          PY

      - name: Commit if changed
        if: ${{ !inputs.dry_run }}
        # Re-fetch before pushing. A run that was queued behind another checks
        # out the SHA pinned when it was CREATED, so it can hold a file that is
        # already stale by the time it pushes — see the trap table in CLAUDE.md.
        # Last writer wins, which is correct: snapshot.json is rebuilt whole
        # from EDGAR every run rather than accumulated.
        run: |
          git config user.name "snapshot-bot"
          git config user.email "snapshot-bot@users.noreply.github.com"
          # Stage first: git diff ignores untracked files, so testing before
          # staging reports no change on a file never committed.
          git add snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged, nothing to commit."
            exit 0
          fi
          cp snapshot.json "$RUNNER_TEMP/snapshot.json"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard "origin/$GITHUB_REF_NAME"
            cp "$RUNNER_TEMP/snapshot.json" snapshot.json
            git add snapshot.json
            if git diff --cached --quiet; then
              echo "Snapshot already current on origin; nothing to push."
              exit 0
            fi
            git commit -q -m "Rebuild snapshot"
            if git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              echo "Committed and pushed snapshot.json on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); another run pushed first. Retrying."
            sleep $((attempt * 3))
          done
          echo "Could not persist snapshot.json after 5 attempts." >&2
          exit 1

name: Probe 52-week crossings

# TEMPORARY — delete this file and probe_52w.py once the questions are
# answered. Read-only: fetches daily bars from Alpaca, prints, exits. No
# webhook, no state, no commit, no schedule.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests
      - name: Probe
        timeout-minutes: 10
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -u probe_52w.py
